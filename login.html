<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · APON Foundation</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <h1>Log in</h1>
      <p class="muted" style="margin:0">Welcome back to APON Foundation.</p>
      <a class="google" href="/api/auth/google"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3A12 12 0 1 1 24 12c3 0 5.8 1.100 7.900 3l5.700-5.700A20 20 0 1 0 44 24c0-1.300-.1-2.600-.4-3.900z"/><path fill="#FF3D00" d="m6.300 14.700 6.600 4.800A12 12 0 0 1 24 12c3 0 5.800 1.100 7.900 3l5.700-5.700A20 20 0 0 0 6.300 14.700z"/><path fill="#4CAF50" d="M24 44c5.200 0 9.900-2 13.400-5.200l-6.200-5.200A12 12 0 0 1 12.700 28l-6.600 5.100A20 20 0 0 0 24 44z"/><path fill="#1976D2" d="M43.600 20.100H42V20H24v8h11.300a12 12 0 0 1-4.100 5.600l6.200 5.200C37 39.200 44 34 44 24c0-1.300-.1-2.600-.4-3.900z"/></svg> Continue with Google</a>
      <div class="divider">or use email</div>
      <form id="form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="msg" role="alert"></p>
        <button class="primary" type="submit">Log in</button>
      </form>
      <p class="foot">New here? <a href="signup.html">Create an account</a> · <a href="index.html">Back to site</a></p>
    </div>
  </div>
  <script src="auth.js"></script>
  <script>
    bindAuthForm(document.getElementById('form'), '/auth/login');
    const err = new URLSearchParams(location.search).get('error');
    if (err) document.querySelector('.msg').textContent = GOOGLE_ERRORS[err] || 'Something went wrong.';
    currentUser().then((u) => { if (u) location.href = homeFor(u); });
  </script>
</body>
</html>
