<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pages · Admin · APON Foundation</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" type="image/x-icon" href="assets/admin.png">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">APON Foundation · Admin</a>
    <nav><a href="admin.html">Accounts</a><a href="admin-pages.html" aria-current="page">Pages</a></nav>
    <div class="who"><span id="who"></span><button id="logout">Log out</button></div>
  </header>
  <main hidden id="app">
    <div class="page-head"><h1>Pages</h1><button class="solid" id="new">New page</button></div>

    <section class="panel" style="margin-top:1rem">
      <p class="msg" id="list-msg" role="alert"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Title</th><th>URL</th><th>Status</th><th>In nav</th><th>Updated</th><th>Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="muted" id="empty" hidden>No pages yet. Select "New page" to write one.</p>
    </section>

    <section class="panel" id="editor-panel">
      <h2 id="editor-title" style="margin-top:0;font-size:1.1rem">New page</h2>
      <form id="editor">
        <div class="form-row">
          <div><label for="title">Title</label><input id="title" required></div>
          <div><label for="slug">URL slug (optional)</label><input id="slug" placeholder="made from the title if empty"></div>
        </div>
        <div class="editor-grid">
          <div>
            <label for="content">Content (Markdown)</label>
            <textarea id="content" rows="16" placeholder="# Heading&#10;&#10;A paragraph with **bold**, *italic* and a [link](https://example.com).&#10;&#10;- List item&#10;&#10;![Image](/assets/apon_logo.jpeg)"></textarea>
          </div>
          <div><label>Preview</label><div class="box prose" id="preview"></div></div>
        </div>
        <label class="check"><input type="checkbox" id="published"> Published (visible to everyone)</label>
        <label class="check"><input type="checkbox" id="show_in_nav"> Show in the site navigation (when published)</label>
        <p class="msg" id="form-msg" role="status"></p>
        <button class="primary" style="max-width:220px" type="submit">Save page</button>
      </form>
    </section>
  </main>
  <script src="auth.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let pages = [], editingId = null;

    function edit(p) {
      editingId = p ? p.id : null;
      $('editor-title').textContent = p ? 'Edit page: ' + p.title : 'New page';
      $('title').value = p ? p.title : '';
      $('slug').value = p ? p.slug : '';
      $('content').value = p ? p.content : '';
      $('published').checked = p ? p.published : false;
      $('show_in_nav').checked = p ? p.show_in_nav : false;
      $('form-msg').textContent = '';
      preview();
    }
    const preview = () => { $('preview').innerHTML = renderMarkdown($('content').value) || '<p class="muted">Nothing to preview yet.</p>'; };

    async function load() {
      try {
        pages = (await api('/admin/pages')).pages;
        $('empty').hidden = pages.length > 0;
        $('rows').innerHTML = pages.map((p) => `<tr data-id="${p.id}">
          <td>${esc(p.title)}</td>
          <td><a href="/p/${encodeURIComponent(p.slug)}" target="_blank" rel="noopener">/p/${esc(p.slug)}</a></td>
          <td>${p.published ? '<span class="badge">Published</span>' : '<span class="muted">Draft</span>'}</td>
          <td>${p.show_in_nav ? 'Yes' : 'No'}</td>
          <td>${fmtDate(p.updated_at)}</td>
          <td><div class="row-actions">
            <button data-act="edit">Edit</button>
            <button data-act="delete" class="danger">Delete</button>
          </div></td></tr>`).join('');
      } catch (err) { $('list-msg').textContent = err.message; }
    }

    $('rows').addEventListener('click', async (e) => {
      const act = e.target.dataset.act; if (!act) return;
      const p = pages.find((x) => x.id === Number(e.target.closest('tr').dataset.id));
      if (act === 'edit') { edit(p); $('editor-panel').scrollIntoView({ behavior: 'smooth' }); }
      if (act === 'delete' && confirm(`Delete "${p.title}"? This cannot be undone.`)) {
        try { await api('/admin/pages?id=' + p.id, { method: 'DELETE' }); if (editingId === p.id) edit(null); load(); }
        catch (err) { $('list-msg').textContent = err.message; }
      }
    });

    $('new').onclick = () => { edit(null); $('editor-panel').scrollIntoView({ behavior: 'smooth' }); $('title').focus(); };
    $('content').addEventListener('input', preview);

    $('editor').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = $('form-msg');
      const body = { id: editingId, title: $('title').value, slug: $('slug').value, content: $('content').value,
                     published: $('published').checked, show_in_nav: $('show_in_nav').checked };
      try {
        const { page } = await api('/admin/pages', { method: editingId ? 'PATCH' : 'POST', body });
        edit(page); msg.className = 'msg ok'; msg.textContent = 'Saved.'; load();
      } catch (err) { msg.className = 'msg'; msg.textContent = err.message; }
    });

    $('logout').onclick = logout;
    guard('admin').then((u) => { if (!u) return; $('who').textContent = u.email; $('app').hidden = false; edit(null); load(); });
  </script>
</body>
</html>
